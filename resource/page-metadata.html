<div class="post-meta">
    <div class="meta-left">
        <div class="publish-date">Published on: {{.PublishDateString}}</div>
        {{if .Tags}}
        <div class="tags">Tags:
            {{range .Tags}}
            <span class="tag"><a href="/tags/{{.}}">#{{.}}</a></span>
            {{end}}
        </div>
        {{end}}
    </div>
    {{if .LocalePages}}
    <div class="meta-right">
        <div class="locale-pages">Languages:
            {{range .LocalePages}}
            <a href="/{{.Path}}">{{.Language}}</a>
            {{end}}
        </div>
    </div>
    {{end}}
</div>
